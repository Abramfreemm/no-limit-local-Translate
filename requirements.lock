# requirements.lock —— 确定版本依赖清单（pip freeze 精度，含全部传递依赖）
#
# 生成方式：python -m pip freeze > requirements.lock
#
# 用途与边界（重要）：
#   本文件是**本机 Windows 环境的版本快照**，用于复现与排查「为什么我这边跑不通」。
#   它含 pywin32-ctypes 等 Windows-only 包，**CI 与跨平台构建请勿直接安装本文件** ——
#   在 ubuntu / macos runner 上会失败。CI 请用 requirements.txt（跨平台下界约束）。
#
# 已知例外（勿当成故障）：
#   rapidocr-onnxruntime 硬声明依赖 opencv-python，但我们只安装
#   opencv-python-headless —— 两者提供完全相同的 cv2 模块，headless 版
#   不捆绑 Qt，避免与 PySide6 自带的 Qt 冲突（两个 Qt 混装是经典崩溃源）。
#   实测 OCR 链路可用（cv2 5.0.0、无 Qt 模块、RapidOCR 可实例化并跑通）。
#   若把 headless 换回 opencv-python，需重新验证 GUI 启动不崩。
#
# 维护约定：
#   - 改 requirements.txt 后必须重新生成本文件，两者一起提交
#   - 升级依赖前先跑 pip-audit，高危漏洞必须清零或在 09 号风险表登记缓解措施
#   - 本文件不含 hash，故不用于 --require-hashes 模式（见 20 号 ADR / D14）

