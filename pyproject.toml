[project]
name = "linguaforge"
version = "0.1.0"
description = "LinguaForge（译匠）—— 本地离线文档翻译器：不限页数与大小，数据不出本机"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "LinguaForge" }]

# 运行时依赖（全部为宽松许可证：Apache-2.0 / BSD / MIT / LGPL-3.0 动态链接）
# 严禁引入 AGPL/GPL/NC 许可证依赖 —— 详见 docs/09-风险与合规清单.md
dependencies = [
    # PDF 内核
    "pypdfium2>=4.30",        # Apache-2.0 / BSD-3-Clause  渲染
    "pdfplumber>=0.11",       # MIT                        文本+坐标提取
    "pypdf>=6.0",             # BSD-3-Clause               合并/拆分/书签
    "reportlab>=4.2",         # BSD-3-Clause               生成回填层
    # OCR
    "rapidocr-onnxruntime>=1.2.3",  # Apache-2.0  默认 OCR 引擎
    "onnxruntime>=1.19",          # MIT
    "opencv-python-headless>=4.10", # Apache-2.0 图像预处理
    "Pillow>=10.4",               # HPND
    "numpy>=1.26",                # BSD-3-Clause
    # 办公格式
    "python-docx>=1.1",       # MIT
    "python-pptx>=1.0",       # MIT
    "openpyxl>=3.1",          # MIT
    "beautifulsoup4>=4.12",   # MIT
    "lxml>=5.2",              # BSD-3-Clause
    # 基础设施
    "httpx>=0.27",            # BSD-3-Clause  调用 Ollama
    "platformdirs>=4.2",      # MIT
    "loguru>=0.7",            # MIT
    "psutil>=6.0",            # BSD-3-Clause  内存护栏
    # UI
    "PySide6>=6.8",           # LGPL-3.0（动态链接）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.7",
    "pip-licenses>=5.0",
]
ocr-hq = [
    "paddleocr>=3.0",         # Apache-2.0 高精度可选后端（按需，不进安装包）
]

[project.scripts]
linguaforge = "linguaforge.cli:main"
linguaforge-cli = "linguaforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["linguaforge*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# 用 dist*/build* 通配：打包改用带后缀的输出目录（如 dist_final）时，
# 写死的 "build"/"dist" 匹配不到，ruff 会把 _internal 里的第三方源码
# 全扫一遍，冒出几百个与本项目无关的错误。
exclude = [".venv", "build*", "dist*", "resources", "releases"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: 需要 Ollama 或 OCR 模型的集成测试",
]
filterwarnings = ["ignore::DeprecationWarning"]
