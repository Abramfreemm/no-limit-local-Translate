name: build

# 决策 D5（docs/07 §3 方案 A）：macOS dmg 无法在 Windows 交叉编译，
# 因此 Windows 与 macOS 两个产物统一在 GitHub Actions 上构建。
# 触发：推送 v* tag，或手动 dispatch。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- Windows
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 准备资源（字体 / OCR 模型）
        shell: pwsh
        run: python scripts/prepare_resources.py

      - name: PyInstaller 打包（onedir）
        run: pyinstaller packaging/win/linguaforge.spec --noconfirm --clean

      - name: 冒烟测试
        run: |
          dist\linguaforge\linguaforge.exe --version
          dist\linguaforge\linguaforge-cli.exe --help

      - name: Inno Setup 制作安装包
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: packaging/win/inno_setup.iss
          options: /O+

      - name: 生成校验值
        shell: pwsh
        run: |
          Get-ChildItem packaging/win/Output/*.exe |
            ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash + "  " + $_.Name } |
            Out-File -Encoding utf8 dist/SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            packaging/win/Output/*.exe
            dist/SHA256SUMS-windows.txt

  # ---------------------------------------------------------------- macOS
  build-macos:
    runs-on: macos-14          # Apple Silicon (arm64)。如需 Intel 包，再加一个 macos-13 job
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller dmgbuild

      - name: 准备资源（字体 / OCR 模型）
        run: python scripts/prepare_resources.py

      - name: 架构断言（必须是 arm64 / universal2）
        run: |
          python -c "import platform,sys; print(platform.machine()); assert platform.machine()=='arm64'"

      - name: PyInstaller 打包 .app
        run: pyinstaller packaging/mac/linguaforge.spec --noconfirm --clean

      - name: ad-hoc 签名（D6：V1.0 不采购证书）
        run: codesign --deep --force --sign - dist/LinguaForge.app

      - name: 生成 dmg
        run: python -m dmgbuild -s packaging/mac/dmg_settings.py "LinguaForge" dist/LinguaForge-macos-arm64.dmg -D app=dist/LinguaForge.app

      - name: 生成校验值
        run: shasum -a 256 dist/*.dmg > dist/SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            dist/SHA256SUMS-macos.txt

  # ---------------------------------------------------------------- 发布
  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            ## LinguaForge ${{ github.ref_name }}
            - Windows：`*-Setup.exe`（双击安装）
            - macOS：`*-arm64.dmg`（拖入 Applications；未签名，首次需右键 → 打开）
            - SHA256 校验值见同名 txt
          draft: true
