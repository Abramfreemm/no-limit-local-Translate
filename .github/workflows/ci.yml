name: CI · 门禁

# 这是 0.1.0 的 P0-1 产物。此前仓库只有 release.yml（安装→打包→--version 冒烟），
# 26 个单测与 ruff 全部只在本地跑过 —— 任何人 push 破坏测试的提交，CI 依然是绿的。
# 本工作流把「静态检查 + 单测 + 许可 + 依赖漏洞」变成发版前的强制门禁。
# 具体检查项在 .github/actions/quality-gate/action.yml，与 release.yml 共用。

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# 只给读权限；写操作仅发生在 release.yml
permissions:
  contents: read

jobs:
  quality:
    name: 静态检查 + 单测（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 所有检查集中在这里，与 release.yml 共用同一份实现，避免两处漂移
      - uses: ./.github/actions/quality-gate

      - name: 上传许可清单
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licenses-${{ matrix.os }}
          path: licenses.csv
          if-no-files-found: ignore
