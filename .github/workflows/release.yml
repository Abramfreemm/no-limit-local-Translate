name: Build & Release (Win exe + macOS dmg)

# dmg 必须在 macOS 上构建，Windows 无法交叉产出可用的 arm64 .app，
# 所以整条发布流水线放 GitHub Actions：win / mac 双 job 并行产出安装包。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，如 0.1.0"
        required: false
        default: "0.1.0"

permissions:
  contents: write

jobs:
  # 质量闸门：tag push 不触发 ci.yml（ci.yml 只监听分支与 PR），
  # 所以发版流程必须自带一份同样的检查，否则红灯代码一样能被打包发布。
  quality-gate:
    name: 质量闸门 · 发版前置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 与 ci.yml 共用同一份实现。tag push 不触发 ci.yml，needs 也不能跨 workflow，
      # 所以发版路径必须自带这道门禁；共用 action 保证两处永不漂移。
      - uses: ./.github/actions/quality-gate

  build-windows:
    name: Windows · exe 安装包
    needs: quality-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller fonttools pip-licenses

      - name: 准备资源（字体 / OCR 模型）
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/prepare_resources.py

      - name: PyInstaller 打包
        run: pyinstaller packaging/win/linguaforge.spec --noconfirm --distpath dist_v2 --workpath build_v2

      - name: 冒烟验证（exe 能起来、CLI 能响应）
        shell: bash
        run: |
          # 注意：PyInstaller 输出目录是 dist_v2（见上面的 --distpath），别写回 dist
          ./dist_v2/LinguaForge/linguaforge-cli.exe --version || exit 1
          test -f ./dist_v2/LinguaForge/LinguaForge.exe || { echo "GUI 主程序缺失"; exit 1; }
          test -d ./dist_v2/LinguaForge/_internal/resources/fonts || { echo "中文字体未打进包"; exit 1; }
          echo "smoke ok"

      - name: Inno Setup 制作安装包
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "packaging\win\inno_setup.iss"

      - name: 收集产物并计算校验值
        shell: bash
        run: |
          # 安装包由 iscc 输出到 packaging/win/Output（见 inno_setup.iss 的 OutputDir）
          mkdir -p artifacts
          cp packaging/win/Output/*.exe artifacts/
          (cd artifacts && sha256sum *.exe > SHA256SUMS.txt)
          cat artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LinguaForge-Windows
          path: |
            artifacts/*.exe
            artifacts/SHA256SUMS.txt

  build-macos:
    name: macOS · dmg
    needs: quality-gate
    runs-on: macos-14            # arm64；如需 x64 换成 macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller fonttools pip-licenses

      - name: 准备资源并生成 icns
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/prepare_resources.py
          mkdir -p resources/icons/tmp.iconset
          sips -s format png resources/icons/app_512.png --out resources/icons/tmp.iconset/icon_512x512.png
          cp resources/icons/app_512.png resources/icons/tmp.iconset/icon_256x256.png
          iconutil -c icns resources/icons/tmp.iconset -o resources/icons/app.icns
          rm -rf resources/icons/tmp.iconset

      - name: 架构断言（必须是 arm64）
        # macos-14 已是 arm64，但这行是防呆：GitHub 换过 runner 环境变体，
        # 一旦跑到 x64 上会产出一份跑不起来的 dmg，而「.app 存在」查不出来。
        run: |
          python -c "import platform; print(platform.machine()); assert platform.machine()=='arm64', 'runner 不是 arm64'"

      - name: PyInstaller 打包 .app
        run: pyinstaller packaging/mac/linguaforge.spec --noconfirm --clean

      - name: ad-hoc 签名（无 Apple 开发者账号时的兼容做法）
        run: |
          codesign --force --deep --sign - dist/LinguaForge.app || true
          codesign --verify --deep --strict dist/LinguaForge.app || echo "::warning::ad-hoc 签名校验未通过（无开发者证书时正常）"

      - name: 冒烟验证
        run: |
          dist/LinguaForge.app/Contents/MacOS/LinguaForge --help || true
          test -d dist/LinguaForge.app && echo "app bundle OK"

      - name: 制作 dmg
        run: |
          brew install create-dmg
          create-dmg \
            --volname "LinguaForge" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "LinguaForge.app" 200 190 \
            --app-drop-link 600 185 \
            --no-internet-enable \
            "dist/LinguaForge-macOS-arm64.dmg" \
            "dist/LinguaForge.app"

      - name: 计算校验值
        run: shasum -a 256 dist/*.dmg > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LinguaForge-macOS
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt

  release:
    name: 汇总发布
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 合并校验值并生成 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/SHA256SUMS.txt
          generate_release_notes: true
